<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Personal AI</title>
    <meta name="theme-color" content="#1e1e2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" id="manifest-placeholder">
    <style>
        :root { --bg: #131314; --sidebar: #1e1f20; --text: #e3e3e3; --accent: #a8c7fa; --user-msg: #282a2c; --border: #333537; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; height: 100dvh; overflow: hidden; }
        
        /* Sidebar */
        #sidebar { width: 280px; background: var(--sidebar); display: flex; flex-direction: column; border-right: 1px solid var(--border); transition: 0.3s; z-index: 100; }
        .sidebar-header { padding: 15px; display: flex; gap: 10px; border-bottom: 1px solid var(--border); }
        button { background: var(--user-msg); color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        button:hover { background: #37393b; }
        .primary-btn { background: var(--accent); color: #041e49; font-weight: 600; border: none; flex: 1; }
        
        #chat-list { flex: 1; overflow-y: auto; padding: 10px; }
        .chat-item { padding: 10px; border-radius: 8px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 14px; }
        .chat-item:hover, .chat-item.active { background: var(--user-msg); }
        .chat-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
        .chat-actions span { margin-left: 6px; font-size: 12px; opacity: 0.7; }
        .chat-actions span:hover { opacity: 1; }
        .pinned-badge { color: var(--accent); margin-right: 4px; }

        /* Main Chat Area */
        #main { flex: 1; display: flex; flex-direction: column; position: relative; }
        header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        #menu-btn { display: none; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 15px; white-space: pre-wrap; word-wrap: break-word; }
        .msg.user { background: var(--user-msg); align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg.ai { background: transparent; align-self: flex-start; border: 1px solid var(--border); border-bottom-left-radius: 2px; }
        .memory-toast { font-size: 12px; color: var(--accent); background: rgba(168, 199, 250, 0.1); padding: 6px 12px; border-radius: 20px; align-self: center; }

        /* Input Area */
        #input-area { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 10px; background: var(--bg); }
        textarea { flex: 1; background: var(--sidebar); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 12px; resize: none; height: 48px; max-height: 120px; font-size: 15px; outline: none; }
        
        /* Modals */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 200; padding: 20px; }
        .modal-content { background: var(--sidebar); padding: 20px; border-radius: 12px; width: 100%; max-width: 450px; border: 1px solid var(--border); }
        .modal-content h3 { margin-bottom: 12px; }
        .modal-content input, .modal-content textarea { width: 100%; margin-bottom: 12px; background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 10px; border-radius: 8px; }
        .memory-item { display: flex; justify-content: space-between; background: var(--bg); padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; font-size: 13px; }

        @media (max-width: 768px) {
            #sidebar { position: fixed; height: 100%; left: -280px; }
            #sidebar.open { left: 0; }
            #menu-btn { display: inline-block; }
        }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="sidebar-header">
        <button class="primary-btn" onclick="createNewChat()">+ New Chat</button>
        <button onclick="toggleSidebar()" id="close-sidebar" style="display:none;">✕</button>
    </div>
    <div id="chat-list"></div>
    <div style="padding: 12px; border-top: 1px solid var(--border); display: flex; gap: 8px;">
        <button style="flex:1;" onclick="openModal('memory-modal')">🧠 Memories</button>
        <button style="flex:1;" onclick="openModal('settings-modal')">⚙️ API Key</button>
    </div>
</div>

<div id="main">
    <header>
        <div style="display:flex; align-items:center; gap:10px;">
            <button id="menu-btn" onclick="toggleSidebar()">☰</button>
            <strong id="current-chat-title">Personal AI</strong>
        </div>
        <span style="font-size:12px; opacity:0.6;" id="memory-count">0 Memories</span>
    </header>
    <div id="messages"></div>
    <div id="input-area">
        <textarea id="prompt-input" placeholder="Kuch bhi puchein ya 'Yaad rakhna...' bolein..." onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); sendMessage();}"></textarea>
        <button class="primary-btn" style="flex:0 0 70px;" onclick="sendMessage()">Send</button>
    </div>
</div>

<!-- Settings Modal -->
<div class="modal" id="settings-modal">
    <div class="modal-content">
        <h3>Google AI Studio Settings</h3>
        <p style="font-size:12px; opacity:0.8; margin-bottom:10px;">Apni nayi Gemini API key yahan paste karein. Yeh sirf aapke phone/browser mein save rahegi.</p>
        <input type="password" id="api-key-input" placeholder="AIzaSy...">
        <div style="display:flex; justify-content:flex-end; gap:10px;">
            <button onclick="closeModal('settings-modal')">Cancel</button>
            <button class="primary-btn" style="flex:0;" onclick="saveApiKey()">Save Key</button>
        </div>
    </div>
</div>

<!-- Memory Modal -->
<div class="modal" id="memory-modal">
    <div class="modal-content">
        <h3>Saved Memories (Permanent)</h3>
        <p style="font-size:12px; opacity:0.8; margin-bottom:10px;">AI har chat mein in baaton ko yaad rakhega:</p>
        <div id="memory-list" style="max-height: 200px; overflow-y: auto; margin-bottom: 10px;"></div>
        <div style="display:flex; gap:6px; margin-bottom:12px;">
            <input type="text" id="manual-memory" placeholder="Nayi memory add karein..." style="margin:0;">
            <button onclick="addManualMemory()">Add</button>
        </div>
        <div style="display:flex; justify-content:flex-end;">
            <button onclick="closeModal('memory-modal')">Close</button>
        </div>
    </div>
</div>

<script>
    // PWA Manifest Setup
    const manifest = {
        name: "Personal Gemini AI",
        short_name: "My AI",
        start_url: ".",
        display: "standalone",
        background_color: "#131314",
        theme_color: "#1e1e2e",
        icons: [{ src: "https://www.gstatic.com/lamda/images/gemini_sparkle_v002_d4735304ff6292a690345.svg", sizes: "192x192", type: "image/svg+xml" }]
    };
    document.getElementById('manifest-placeholder').setAttribute('href', 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest)));

    // State Management
    let apiKey = localStorage.getItem('gemini_api_key') || '';
    let memories = JSON.parse(localStorage.getItem('ai_memories') || '[]');
    let chats = JSON.parse(localStorage.getItem('ai_chats') || '[]');
    let currentChatId = null;

    function init() {
        if (!apiKey) openModal('settings-modal');
        if (chats.length === 0) createNewChat();
        else selectChat(chats[0].id);
        updateMemoryUI();
    }

    function saveData() {
        localStorage.setItem('ai_memories', JSON.stringify(memories));
        localStorage.setItem('ai_chats', JSON.stringify(chats));
        renderChatList();
        updateMemoryUI();
    }

    function saveApiKey() {
        apiKey = document.getElementById('api-key-input').value.trim();
        localStorage.setItem('gemini_api_key', apiKey);
        closeModal('settings-modal');
    }

    // Chat Management (Create, Rename, Pin, Delete)
    function createNewChat() {
        const newChat = { id: Date.now().toString(), title: 'New Chat', pinned: false, messages: [] };
        chats.unshift(newChat);
        saveData();
        selectChat(newChat.id);
        if (window.innerWidth <= 768) toggleSidebar(false);
    }

    function selectChat(id) {
        currentChatId = id;
        const chat = chats.find(c => c.id === id);
        document.getElementById('current-chat-title').innerText = chat.title;
        renderMessages();
        renderChatList();
    }

    function renameChat(id, e) {
        e.stopPropagation();
        const chat = chats.find(c => c.id === id);
        const newName = prompt("Chat ka naya naam likhein:", chat.title);
        if (newName) {
            chat.title = newName;
            if (currentChatId === id) document.getElementById('current-chat-title').innerText = newName;
            saveData();
        }
    }

    function togglePin(id, e) {
        e.stopPropagation();
        const chat = chats.find(c => c.id === id);
        chat.pinned = !chat.pinned;
        chats.sort((a, b) => (b.pinned - a.pinned));
        saveData();
    }

    function deleteChat(id, e) {
        e.stopPropagation();
        if (!confirm("Kya aap is chat ko delete karna chahte hain?")) return;
        chats = chats.filter(c => c.id !== id);
        if (chats.length === 0) createNewChat();
        else if (currentChatId === id) selectChat(chats[0].id);
        saveData();
    }

    function renderChatList() {
        const list = document.getElementById('chat-list');
        list.innerHTML = '';
        chats.forEach(chat => {
            const div = document.createElement('div');
            div.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
            div.onclick = () => { selectChat(chat.id); if (window.innerWidth <= 768) toggleSidebar(false); };
            div.innerHTML = `
                <div class="chat-title">${chat.pinned ? '<span class="pinned-badge">📌</span>' : ''}${chat.title}</div>
                <div class="chat-actions">
                    <span onclick="togglePin('${chat.id}', event)" title="Pin">📌</span>
                    <span onclick="renameChat('${chat.id}', event)" title="Rename">✏️</span>
                    <span onclick="deleteChat('${chat.id}', event)" title="Delete">🗑️</span>
                </div>
            `;
            list.appendChild(div);
        });
    }

    // Memory Management
    function updateMemoryUI() {
        document.getElementById('memory-count').innerText = `${memories.length} Memories`;
        const list = document.getElementById('memory-list');
        list.innerHTML = memories.length ? '' : '<p style="font-size:12px; opacity:0.5;">Koi memory save nahi hai.</p>';
        memories.forEach((mem, idx) => {
            list.innerHTML += `<div class="memory-item"><span>${mem}</span><span style="cursor:pointer;color:#ff6b6b;" onclick="deleteMemory(${idx})">✕</span></div>`;
        });
    }

    function addManualMemory() {
        const val = document.getElementById('manual-memory').value.trim();
        if (val) {
            memories.push(val);
            document.getElementById('manual-memory').value = '';
            saveData();
        }
    }

    function deleteMemory(idx) {
        memories.splice(idx, 1);
        saveData();
    }

    // Messaging & Gemini API Integration
    function renderMessages() {
        const container = document.getElementById('messages');
        container.innerHTML = '';
        const chat = chats.find(c => c.id === currentChatId);
        chat.messages.forEach(m => {
            if (m.type === 'memory') {
                container.innerHTML += `<div class="memory-toast">🧠 Memory Saved: "${m.text}"</div>`;
            } else {
                container.innerHTML += `<div class="msg ${m.role}">${m.text}</div>`;
            }
        });
        container.scrollTop = container.scrollHeight;
    }

    async function sendMessage() {
        if (!apiKey) return openModal('settings-modal');
        const input = document.getElementById('prompt-input');
        const text = input.value.trim();
        if (!text) return;

        input.value = '';
        const chat = chats.find(c => c.id === currentChatId);
        
        // Auto-rename first message
        if (chat.messages.length === 0) {
            chat.title = text.substring(0, 28) + (text.length > 28 ? '...' : '');
            document.getElementById('current-chat-title').innerText = chat.title;
        }

        chat.messages.push({ role: 'user', text });
        renderMessages();

        // System prompt injecting saved memories + instruction to extract new ones
        const systemInstruction = `You are a helpful personal AI assistant. 
        Here are the permanent facts/memories you know about the user from past conversations:
        ${memories.length ? memories.map(m => "- " + m).join("\n") : "No saved memories yet."}
        
        CRITICAL RULE FOR SAVING MEMORY: If the user explicitly asks you to remember something (e.g., "yaad rakhna", "save this", "remember that") OR shares an important permanent personal fact/preference, include a tag at the very end of your response in this exact format: [SAVE_MEMORY: concise fact to remember]. Otherwise do not include this tag.`;

        const contents = chat.messages.filter(m => m.role).map(m => ({
            role: m.role === 'user' ? 'user' : 'model',
            parts: [{ text: m.text }]
        }));

       try {
            const models = ['gemini-3.8-flash', 'gemini-3.8-flash-lite', 'gemini-2.5-flash-lite'];
            let data = null;
            let lastError = '';

            for (const model of models) {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: { parts: [{ text: systemInstruction }] },
                        contents: contents
                    })
                });
                data = await response.json();
                if (!data.error) break; // Agar jawab mil gaya to loop rok dein
                lastError = data.error.message;
                // Agar high demand ya quota issue nahi hai (jaise galat API key), to turant error dikhayein
                if (!lastError.toLowerCase().includes('demand') && !lastError.toLowerCase().includes('overloaded') && !lastError.toLowerCase().includes('quota') && !lastError.toLowerCase().includes('not found')) {
                    throw new Error(lastError);
                }
            }

            if (data.error) throw new Error(lastError);

            let reply = data.candidates[0].content.parts[0].text;

            // Check if AI extracted a new memory
            const memMatch = reply.match(/\[SAVE_MEMORY:\s*(.*?)\]/);
            if (memMatch) {
                const newMem = memMatch[1].trim();
                memories.push(newMem);
                reply = reply.replace(memMatch[0], '').trim();
                chat.messages.push({ type: 'memory', text: newMem });
            }

            chat.messages.push({ role: 'ai', text: reply });
            saveData();
            renderMessages();
        } catch (err) {
            chat.messages.push({ role: 'ai', text: 'Error: ' + err.message });
            renderMessages();
        }
    }

    // UI Helpers
    function toggleSidebar(force) {
        const sb = document.getElementById('sidebar');
        const closeBtn = document.getElementById('close-sidebar');
        const isOpen = force !== undefined ? force : !sb.classList.contains('open');
        sb.classList.toggle('open', isOpen);
        closeBtn.style.display = isOpen ? 'block' : 'none';
    }
    function openModal(id) { 
        if(id === 'settings-modal') document.getElementById('api-key-input').value = apiKey;
        document.getElementById(id).style.display = 'flex'; 
    }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    init();
</script>
</body>
</html>
